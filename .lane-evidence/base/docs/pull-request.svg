<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b2d"/><stop offset="1" stop-color="#1c2f4a"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/></pattern>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3c8"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d98c8c"/></marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8fd1b0"/></marker>
    <marker id="arrAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9c08c"/></marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fc7ea"/></marker>
    <marker id="arrPale" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c7d9ea"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <text x="64" y="80" font-size="40" fill="#f3efe6" letter-spacing="-0.5">A pull request becomes one table</text>
  <text x="66" y="120" font-size="22" fill="#9fb3c8">Every changed function gets a row; an unchanged one gets a row when a function it calls changed.</text>
  <rect x="64" y="162" width="256" height="128" fill="#0b1422" stroke="#3c5272" stroke-width="1.2"/>
  <text x="84" y="196" font-size="15" fill="#9fb3c8" letter-spacing="2">PULL REQUEST</text>
  <text x="84" y="234" font-size="20" fill="#f3efe6">base and head</text>
  <text x="84" y="262" font-size="20" fill="#f3efe6">commits</text>
  <polyline points="320,226 364,226" fill="none" stroke="#9fb3c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="368" y="162" width="256" height="128" fill="#0b1422" stroke="#3c5272" stroke-width="1.2"/>
  <text x="388" y="196" font-size="15" fill="#9fb3c8" letter-spacing="2">INTAKE</text>
  <text x="388" y="234" font-size="20" fill="#f3efe6">one row per changed</text>
  <text x="388" y="262" font-size="20" fill="#f3efe6">function, checked or not</text>
  <polyline points="624,226 668,226" fill="none" stroke="#9fb3c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="672" y="162" width="256" height="128" fill="#0b1422" stroke="#3c5272" stroke-width="1.2"/>
  <text x="692" y="196" font-size="15" fill="#9fb3c8" letter-spacing="2">CACHE</text>
  <text x="692" y="234" font-size="20" fill="#f3efe6">same key as before?</text>
  <text x="692" y="262" font-size="20" fill="#f3efe6">the row is reused</text>
  <polyline points="928,226 972,226" fill="none" stroke="#9fb3c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="976" y="162" width="256" height="128" fill="#0b1422" stroke="#3c5272" stroke-width="1.2"/>
  <text x="996" y="196" font-size="15" fill="#9fb3c8" letter-spacing="2">CHECK</text>
  <text x="996" y="234" font-size="20" fill="#f3efe6">lane B, then lane A,</text>
  <text x="996" y="262" font-size="20" fill="#f3efe6">within a named budget</text>
  <polyline points="1232,226 1276,226" fill="none" stroke="#9fb3c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="1280" y="162" width="256" height="128" fill="#0b1422" stroke="#3c5272" stroke-width="1.2"/>
  <text x="1300" y="196" font-size="15" fill="#9fb3c8" letter-spacing="2">ONE TABLE</text>
  <text x="1300" y="234" font-size="20" fill="#f3efe6">a verdict and a</text>
  <text x="1300" y="262" font-size="20" fill="#f3efe6">certificate per row</text>
  <rect x="64" y="340" width="1030" height="376" fill="#0b1422" stroke="#3c5272" stroke-width="1"/>
  <text x="84" y="374" font-size="14" fill="#9fb3c8" letter-spacing="2">FUNCTION</text>
  <text x="314" y="374" font-size="14" fill="#9fb3c8" letter-spacing="2">VERDICT</text>
  <text x="524" y="374" font-size="14" fill="#9fb3c8" letter-spacing="2">WHAT THE ROW SAYS</text>
  <line x1="64" y1="392" x2="1094" y2="392" stroke="#3c5272" stroke-width="1"/>
  <text x="84" y="426" font-size="19" fill="#f3efe6" font-family="Menlo, Consolas, monospace" xml:space="preserve">unitDiscount</text>
  <rect x="314" y="401" width="186" height="36" fill="#2b3550" stroke="#5a6a90" stroke-width="1.5"/>
  <text x="407.0" y="426.0" font-size="17" fill="#f3efe6" text-anchor="middle" font-weight="bold">IN-SCOPE</text>
  <text x="524" y="426" font-size="18" fill="#c9d4e0">declared in scope; no difference within the bound</text>
  <line x1="64" y1="446" x2="1094" y2="446" stroke="#3c5272" stroke-width="1"/>
  <text x="84" y="480" font-size="19" fill="#f3efe6" font-family="Menlo, Consolas, monospace" xml:space="preserve">deliveryFee</text>
  <rect x="314" y="455" width="186" height="36" fill="#5a2a2a" stroke="#8a4a4a" stroke-width="1.5"/>
  <text x="407.0" y="480.0" font-size="17" fill="#f3efe6" text-anchor="middle" font-weight="bold">WITNESS</text>
  <text x="524" y="480" font-size="18" fill="#c9d4e0">input 11: &gt;= became &gt;; pricing.ts:59</text>
  <line x1="64" y1="500" x2="1094" y2="500" stroke="#3c5272" stroke-width="1"/>
  <text x="84" y="534" font-size="19" fill="#f3efe6" font-family="Menlo, Consolas, monospace" xml:space="preserve">formatCents</text>
  <rect x="314" y="509" width="186" height="36" fill="#1f4a3a" stroke="#3d7a62" stroke-width="1.5"/>
  <text x="407.0" y="534.0" font-size="17" fill="#f3efe6" text-anchor="middle" font-weight="bold">PASS-proved</text>
  <text x="524" y="534" font-size="18" fill="#c9d4e0">the refactor is a theorem</text>
  <line x1="64" y1="554" x2="1094" y2="554" stroke="#3c5272" stroke-width="1"/>
  <text x="84" y="588" font-size="19" fill="#f3efe6" font-family="Menlo, Consolas, monospace" xml:space="preserve">cleanCart</text>
  <rect x="314" y="563" width="186" height="36" fill="#2a4256" stroke="#4f7391" stroke-width="1.5"/>
  <text x="407.0" y="588.0" font-size="17" fill="#f3efe6" text-anchor="middle" font-weight="bold">PASS-bounded</text>
  <text x="524" y="588" font-size="18" fill="#c9d4e0">lane A: ASK:identity, the result may share an input</text>
  <line x1="64" y1="608" x2="1094" y2="608" stroke="#3c5272" stroke-width="1"/>
  <text x="84" y="642" font-size="19" fill="#f3efe6" font-family="Menlo, Consolas, monospace" xml:space="preserve">quoteShop</text>
  <rect x="314" y="617" width="186" height="36" fill="#5a2a2a" stroke="#8a4a4a" stroke-width="1.5"/>
  <text x="407.0" y="642.0" font-size="17" fill="#f3efe6" text-anchor="middle" font-weight="bold">WITNESS</text>
  <text x="524" y="642" font-size="18" fill="#c9d4e0">text unchanged; through deliveryFee, unitDiscount</text>
  <line x1="64" y1="662" x2="1094" y2="662" stroke="#3c5272" stroke-width="1"/>
  <text x="84" y="696" font-size="19" fill="#f3efe6" font-family="Menlo, Consolas, monospace" xml:space="preserve">quoteAll</text>
  <rect x="314" y="671" width="186" height="36" fill="#5a2a2a" stroke="#8a4a4a" stroke-width="1.5"/>
  <text x="407.0" y="696.0" font-size="17" fill="#f3efe6" text-anchor="middle" font-weight="bold">WITNESS</text>
  <text x="524" y="696" font-size="18" fill="#c9d4e0">text unchanged; through deliveryFee, unitDiscount</text>
  <polyline points="1094,520 1150,520 1150,390 1186,390" fill="none" stroke="#9fb3c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <polyline points="1094,520 1150,520 1150,640 1186,640" fill="none" stroke="#9fb3c8" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="1190" y="330" width="346" height="130" fill="#0b1422" stroke="#3c5272" stroke-width="1.2"/>
  <text x="1210" y="364" font-size="15" fill="#9fb3c8" letter-spacing="2">ONE COMMENT</text>
  <text x="1210" y="400" font-size="20" fill="#f3efe6">on the pull request,</text>
  <text x="1210" y="428" font-size="20" fill="#f3efe6">updated on every push</text>
  <rect x="1190" y="560" width="346" height="200" fill="#0b1422" stroke="#8a4a4a" stroke-width="1.5"/>
  <text x="1210" y="594" font-size="15" fill="#d98c8c" letter-spacing="2">A BLOCKING CHECK</text>
  <text x="1210" y="630" font-size="19" fill="#f3efe6">--block witness fails it</text>
  <text x="1210" y="658" font-size="19" fill="#f3efe6">on a WITNESS row; each</text>
  <text x="1210" y="686" font-size="19" fill="#f3efe6">row annotated at its line.</text>
  <text x="1210" y="714" font-size="19" fill="#f3efe6">IN-SCOPE never blocks.</text>
  <line x1="64" y1="836" x2="1536" y2="836" stroke="#3c5272" stroke-width="1"/>
  <text x="64" y="868" font-size="18" fill="#8a9bb0">The table above is a real run: node langs/ts/pr.mjs --repo . --base 85136f1~1 --head 85136f1 --scope unitDiscount</text>
</svg>
