<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#1c2f4a"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9fb3c8"/>
    </marker>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <!-- wordmark -->
  <text x="72" y="118" font-size="96" fill="#f3efe6" letter-spacing="-2">lean</text>
  <text x="74" y="162" font-size="24" fill="#c9d4e0">Write TypeScript like mathematics.</text>
  <text x="74" y="194" font-size="24" fill="#c9d4e0">Prove a change did only what you asked.</text>

  <!-- the equation -->
  <text x="74" y="262" font-size="30" fill="#f3efe6" font-style="italic">f</text>
  <text x="90" y="270" font-size="15" fill="#9fb3c8">parent</text>
  <text x="132" y="262" font-size="30" fill="#f3efe6">(x) = </text>
  <text x="210" y="262" font-size="30" fill="#f3efe6" font-style="italic">f</text>
  <text x="226" y="270" font-size="15" fill="#9fb3c8">candidate</text>
  <text x="296" y="262" font-size="30" fill="#f3efe6">(x)</text>
  <text x="362" y="262" font-size="26" fill="#9fb3c8">for every x outside S</text>
  <text x="74" y="306" font-size="17" fill="#8a9bb0">checked by a prover, or refuted by an input you can run. Never by opinion.</text>

  <!-- right: the pipeline card -->
  <g transform="translate(760,52)">
    <rect x="0" y="0" width="372" height="276" fill="#0b1422" stroke="#3c5272" stroke-width="1"/>
    <text x="20" y="34" font-size="15" fill="#9fb3c8" letter-spacing="2">PARENT · CANDIDATE</text>

    <!-- lane B -->
    <rect x="20" y="52" width="332" height="58" fill="#13223a" stroke="#3c5272" stroke-width="1"/>
    <text x="34" y="76" font-size="17" fill="#f3efe6">run both against the same world</text>
    <text x="34" y="98" font-size="14" fill="#9fb3c8">same fakes · frozen clock · typed inputs</text>
    <line x1="186" y1="110" x2="186" y2="130" stroke="#9fb3c8" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- lane A -->
    <rect x="20" y="132" width="332" height="58" fill="#13223a" stroke="#3c5272" stroke-width="1"/>
    <text x="34" y="156" font-size="17" fill="#f3efe6">translate both to Dafny, prove them equal</text>
    <text x="34" y="178" font-size="14" fill="#9fb3c8">effects as world transitions · one theorem · Z3</text>
    <line x1="186" y1="190" x2="186" y2="210" stroke="#9fb3c8" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- verdicts -->
    <g transform="translate(20,214)">
      <rect x="0" y="0" width="78" height="40" fill="#5a2a2a" stroke="#8a4a4a"/>
      <text x="39" y="25" font-size="13" fill="#f3efe6" text-anchor="middle">WITNESS</text>
      <rect x="85" y="0" width="78" height="40" fill="#1f4a3a" stroke="#3d7a62"/>
      <text x="124" y="19" font-size="12" fill="#f3efe6" text-anchor="middle">PASS</text>
      <text x="124" y="33" font-size="11" fill="#bfe3d0" text-anchor="middle">proved</text>
      <rect x="170" y="0" width="78" height="40" fill="#2a4256" stroke="#4f7391"/>
      <text x="209" y="19" font-size="12" fill="#f3efe6" text-anchor="middle">PASS</text>
      <text x="209" y="33" font-size="11" fill="#c7d9ea" text-anchor="middle">bounded</text>
      <rect x="255" y="0" width="77" height="40" fill="#4a3f1f" stroke="#8a7540"/>
      <text x="293" y="25" font-size="13" fill="#f3efe6" text-anchor="middle">ASK</text>
    </g>
  </g>

  <!-- footer line -->
  <line x1="72" y1="332" x2="1128" y2="332" stroke="#3c5272" stroke-width="1"/>
  <text x="72" y="356" font-size="14" fill="#8a9bb0">a regression verifier for TypeScript · proof lane + bounded execution lane · certificates you can re-run · Apache-2.0</text>
</svg>
