<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b2d"/><stop offset="1" stop-color="#1c2f4a"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/></pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9fb3c8"/></marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d98c8c"/></marker>
  </defs>
  <rect width="1200" height="470" fill="url(#bg)"/><rect width="1200" height="470" fill="url(#grid)"/>
  <text x="48" y="46" font-size="22" fill="#f3efe6">A React component is a machine: props and hook slots in, a tree out, one step per event.</text>

  <!-- the machine -->
  <g transform="translate(48,80)">
    <rect x="0" y="0" width="520" height="350" fill="#0b1422" stroke="#3c5272"/>
    <text x="16" y="28" font-size="13" fill="#9fb3c8" letter-spacing="1">STATE</text>
    <rect x="16" y="40" width="230" height="30" fill="#13223a" stroke="#3c5272"/><text x="28" y="60" font-size="13.5" fill="#f3efe6" font-family="Menlo, Consolas, monospace">props   { initial: boolean }</text>
    <rect x="16" y="76" width="230" height="30" fill="#13223a" stroke="#3c5272"/><text x="28" y="96" font-size="13.5" fill="#f3efe6" font-family="Menlo, Consolas, monospace">slot 0  open: boolean</text>
    <rect x="16" y="112" width="230" height="30" fill="#13223a" stroke="#3c5272"/><text x="28" y="132" font-size="13.5" fill="#f3efe6" font-family="Menlo, Consolas, monospace">slot 1  pinned: boolean</text>
    <text x="16" y="172" font-size="13" fill="#9fb3c8" letter-spacing="1">INPUT, ONE COMMAND</text>
    <text x="16" y="196" font-size="13.5" fill="#c9d4e0"><tspan fill="#f3efe6" font-family="Menlo, Consolas, monospace">fire</tspan>(handler, event)   a click, a change</text>
    <text x="16" y="218" font-size="13.5" fill="#c9d4e0"><tspan fill="#f3efe6" font-family="Menlo, Consolas, monospace">settle</tspan>   effects whose deps changed (Object.is), cleanup first</text>
    <text x="16" y="240" font-size="13.5" fill="#c9d4e0"><tspan fill="#f3efe6" font-family="Menlo, Consolas, monospace">tick</tspan>   the virtual clock fires due timers, frames, intervals</text>
    <text x="16" y="262" font-size="13.5" fill="#c9d4e0"><tspan fill="#f3efe6" font-family="Menlo, Consolas, monospace">unmount</tspan>   every cleanup</text>
    <text x="16" y="302" font-size="13" fill="#9fb3c8" letter-spacing="1">OUTPUT, AFTER EACH COMMAND</text>
    <text x="16" y="326" font-size="13.5" fill="#c9d4e0">the element tree, the effect and request trace, the pending work</text>
    <!-- right side of the card: the tree -->
    <g transform="translate(270,40)">
      <rect x="0" y="0" width="234" height="102" fill="#13223a" stroke="#3c5272"/>
      <text x="12" y="22" font-size="12.5" fill="#f3efe6" font-family="Menlo, Consolas, monospace">&lt;div&gt;</text>
      <text x="24" y="42" font-size="12.5" fill="#f3efe6" font-family="Menlo, Consolas, monospace">&lt;button onClick=h0&gt;open</text>
      <text x="24" y="62" font-size="12.5" fill="#f3efe6" font-family="Menlo, Consolas, monospace">&lt;button onClick=h1&gt;free</text>
      <text x="24" y="82" font-size="12.5" fill="#9fb3c8" font-family="Menlo, Consolas, monospace">{open &amp;&amp; pinned &amp;&amp; &lt;p&gt;both}</text>
      <text x="0" y="124" font-size="12" fill="#9fb3c8">rendered twice from the same slots:</text>
      <text x="0" y="142" font-size="12" fill="#9fb3c8">a differing tree is REFUSE render-impure</text>
    </g>
  </g>

  <!-- the product exploration -->
  <g transform="translate(600,80)">
    <rect x="0" y="0" width="552" height="350" fill="#0b1422" stroke="#4f7391"/>
    <text x="16" y="28" font-size="13" fill="#c7d9ea" letter-spacing="1">FINITE BY TYPE: THE PRODUCT OF BOTH MACHINES, EXPLORED</text>
    <!-- nodes: (open,pinned) -->
    <g font-family="Menlo, Consolas, monospace" font-size="12">
      <circle cx="90" cy="110" r="26" fill="#13223a" stroke="#4f7391"/><text x="90" y="106" fill="#f3efe6" text-anchor="middle">F,F</text><text x="90" y="121" fill="#9fb3c8" text-anchor="middle" font-size="10">start</text>
      <circle cx="250" cy="110" r="26" fill="#13223a" stroke="#4f7391"/><text x="250" y="114" fill="#f3efe6" text-anchor="middle">T,T</text>
      <circle cx="90" cy="250" r="26" fill="#13223a" stroke="#4f7391"/><text x="90" y="254" fill="#f3efe6" text-anchor="middle">F,T</text>
      <circle cx="250" cy="250" r="26" fill="#13223a" stroke="#4f7391"/><text x="250" y="254" fill="#f3efe6" text-anchor="middle">T,F</text>
      <!-- edges -->
      <line x1="116" y1="110" x2="222" y2="110" stroke="#9fb3c8" marker-end="url(#arr)"/><text x="168" y="100" fill="#9fb3c8" text-anchor="middle" font-size="11">open</text>
      <line x1="90" y1="136" x2="90" y2="222" stroke="#9fb3c8" marker-end="url(#arr)"/><text x="104" y="184" fill="#9fb3c8" font-size="11">pin</text>
      <line x1="250" y1="136" x2="250" y2="222" stroke="#9fb3c8" marker-end="url(#arr)"/><text x="264" y="184" fill="#9fb3c8" font-size="11">pin</text>
      <line x1="224" y1="250" x2="118" y2="250" stroke="#9fb3c8" marker-end="url(#arr)"/><text x="170" y="270" fill="#9fb3c8" text-anchor="middle" font-size="11">open</text>
      <path d="M 268 92 C 300 60, 300 160, 268 128" fill="none" stroke="#9fb3c8" marker-end="url(#arr)"/><text x="312" y="112" fill="#9fb3c8" font-size="11">open</text>
    </g>
    <text x="16" y="312" font-size="12.5" fill="#c9d4e0">parent and candidate stepped together on every click order from every prop value;</text>
    <text x="16" y="330" font-size="12.5" fill="#c9d4e0">8 state pairs over 2 assignments for this Toggle, 0.7 s: <tspan fill="#9fc7ea" font-weight="bold">PASS-decided</tspan></text>
    <!-- the witness path -->
    <g transform="translate(350,60)">
      <rect x="0" y="0" width="186" height="100" fill="#13223a" stroke="#8a4a4a"/>
      <text x="12" y="22" font-size="12" fill="#d98c8c" letter-spacing="1">THE MUTANT</text>
      <text x="12" y="44" font-size="12.5" fill="#f3efe6" font-family="Menlo, Consolas, monospace">setPinned(true)</text>
      <text x="12" y="62" font-size="12" fill="#9fb3c8">for setPinned(!pinned)</text>
      <text x="12" y="86" font-size="12.5" fill="#f3efe6">WITNESS: <tspan font-family="Menlo, Consolas, monospace">pin, pin</tspan></text>
    </g>
    <g transform="translate(350,180)">
      <rect x="0" y="0" width="186" height="100" fill="#13223a" stroke="#3c5272"/>
      <text x="12" y="22" font-size="12" fill="#9fb3c8" letter-spacing="1">THE OTHER RUNGS</text>
      <text x="12" y="44" font-size="12" fill="#c9d4e0">handlers readable as slot</text>
      <text x="12" y="60" font-size="12" fill="#c9d4e0">transitions: <tspan fill="#8fd1b0">PASS-proved</tspan></text>
      <text x="12" y="80" font-size="12" fill="#c9d4e0">a string or number slot:</text>
      <text x="12" y="96" font-size="12" fill="#c9d4e0">click sequences, <tspan fill="#c7d9ea">PASS-bounded</tspan></text>
    </g>
  </g>
  <text x="48" y="456" font-size="12.5" fill="#8a9bb0">Decided at the element-tree layer, with effects, timers and the request trace. Not judged: the committed DOM, styles, layout, pixels, the accessibility tree. The certificate says so.</text>
</svg>
