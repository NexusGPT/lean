# lean on its own pull requests: every pair test the pull request touches becomes a change set (its parent, then its
# candidate, in a scratch two-commit repository) and its table is posted as the comment. Never blocking.
# The job `image` builds the container image (Dockerfile at the root) and runs ten proof-lane pairs inside it; the job
# `pairs` installs the same pinned Dafny and Z3 the image does (a runner has no brew), so both jobs verify with one toolchain.
name: lean self

on:
  pull_request:
    paths:
      - "langs/ts/tests/pairs/**"
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/lean-docker.sh"

permissions:
  contents: read
  pull-requests: write

jobs:
  pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the pinned dafny and z3 of the image (the Dockerfile's release zip and bundled solver)
        env:
          DAFNY_VERSION: "4.11.0"
          DAFNY_SHA256: a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179
        run: |
          curl -fsSL -o /tmp/dafny.zip "https://github.com/dafny-lang/dafny/releases/download/v${DAFNY_VERSION}/dafny-${DAFNY_VERSION}-x64-ubuntu-22.04.zip"
          echo "${DAFNY_SHA256}  /tmp/dafny.zip" | sha256sum -c -
          sudo unzip -q /tmp/dafny.zip -d /opt
          sudo ln -s /opt/dafny/dafny /usr/local/bin/dafny
          sudo ln -s /opt/dafny/z3/bin/z3-4.12.1 /usr/local/bin/z3
          dafny --version
          z3 --version
      - name: the touched pairs as a two-commit repository
        id: pairs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pairs=$(git diff --name-only "$BASE" "$HEAD" -- langs/ts/tests/pairs | cut -d/ -f5 | sort -u | while read -r p; do [ -d "langs/ts/tests/pairs/$p" ] && echo "$p"; done | paste -sd, -)
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"
          if [ -n "$pairs" ]; then node langs/ts/ci/pairs-repo.mjs --out "$RUNNER_TEMP/pairs" --pairs "$pairs" >> "$GITHUB_OUTPUT"; fi
      - name: lean table and comment
        if: ${{ steps.pairs.outputs.pairs != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEAN_PR: ${{ github.event.pull_request.number }}
        run: |
          node langs/ts/ci/comment.mjs --repo "$RUNNER_TEMP/pairs" --base "${{ steps.pairs.outputs.base }}" --head "${{ steps.pairs.outputs.head }}" \
            --no-project --max-functions 40 --out lean-report.md --post

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: |
          docker build -t lean:ci .
          docker image ls lean:ci
      - name: ten proof-lane pairs inside the image
        env:
          PAIRS: cheap_rungs_congruence cheap_rungs_normalised cheap_rungs_parsed nested_ternary prelude_unit_added definite_assignment prelude_unit non_null narrow_in known_values
        run: |
          docker run --rm -e PAIRS="$PAIRS" lean:ci sh -c 'fail=0; for p in $PAIRS; do echo "=== $p"; JOBS=4 node langs/ts/tests/run.mjs --pair "$p" || fail=1; done; exit $fail'
